- name: Real world simulation of people’s Investing, Earning and Consuming – Agent Based Model
  description:
    - Developed an ABM to simulate real-world saving, investing, and consumption behaviors based on rule-driven agent interactions with their environment.
    - Integrated neural networks and evolutionary algorithms to enable agent learning, adaptation, and emergence of complex behaviors.
    - Optimized behavioral scenarios through continuous simulation, allowing for dynamic insights into economic decision-making patterns.

- name: Growth analysis of Publicly Traded companies – Regression Model
  description:
    - Analyzed key financial ratios (EPS, P/E, ROA, ROE, D/E) across 7 companies—blue chip, mid-tier, and failing—to study their correlation with actual stock prices.
    - Applied linear regression using scikit-learn to train and test predictive models on real stock market data.
    - Evaluated model accuracy using MSE and regression diagnostics to assess the predictive power of fundamental indicators.
