- name: DC-Magnetron Sputtering System – Superconductivity and Tunneling Studies 
  description: 
  - Fabricated and characterized SIN and SIS tunnel junctions using Physical Vapor Deposition with Niobium and Aluminum on silicon substrates.
  - Operated and maintained high-vacuum systems, gas flows, and glow discharge methods; ensured cryogenic safety with materials like liquid helium.
  - Measured I-V characteristics with precision instruments and applied theoretical models to optimize insulator layers and junction performance.
